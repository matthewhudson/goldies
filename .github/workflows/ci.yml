name: CI

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - '.changeset/**'
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        # 22.x is the oldest supported line, and "build (22.x)" is a required check on main.
        # 24.x matches .nvmrc.
        node-version: [22.x, 24.x]

    steps:
    - uses: actions/checkout@v7

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v7
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Lint
      run: npm run lint
    
    - name: Type check
      run: npm run typecheck
    
    - name: Test with coverage
      run: npm run test:coverage
    
    - name: Build
      run: npm run build

    # The build generates package.json's exports, main, module and types
    - name: Check package.json is up to date
      run: git diff --exit-code -- package.json || { echo "::error::package.json is out of date. Run npm run build and commit it."; exit 1; }

    - name: Test built package
      run: npm run test:package

    # Optional: Upload coverage to Codecov
    - name: Upload coverage reports to Codecov
      if: matrix.node-version == '22.x'
      uses: codecov/codecov-action@v7
      with:
        # Token is optional since Codecov can also detect public repositories via GitHub Actions
        # token: ${{ secrets.CODECOV_TOKEN }}
        fail_ci_if_error: false