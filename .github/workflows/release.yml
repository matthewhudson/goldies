name: Release

# main is protected (PRs and the build check are required, admins included), so this
# workflow never pushes to it. With changesets on main, the version job opens or updates a
# "chore(release): version packages" PR. Merging that PR leaves no changesets, so the next
# run builds, checks and packs the package, then publishes it to npm with trusted
# publishing (OIDC, no npm token), pushes the version tag and creates the GitHub release.
on:
  workflow_dispatch: # Manual trigger
  push:
    branches:
      - main

# Each job asks for only the permissions it needs
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  select-mode:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.select-mode.outputs.mode }}
      publish-plan-artifact-id: ${{ steps.select-mode.outputs.publish-plan-artifact-id }}
    permissions:
      contents: read
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Install Dependencies
        run: npm ci

      - name: Select Changesets mode
        id: select-mode
        uses: changesets/action/select-mode@v2

  version:
    if: needs.select-mode.outputs.mode == 'version'
    needs: select-mode
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7
        with:
          # Full history so Changesets can generate changelogs
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Install Dependencies
        run: npm ci

      - name: Create or update version PR
        uses: changesets/action/version@v2
        with:
          script: npm run version-packages
          commit-message: 'chore(release): version packages'
          pr-title: 'chore(release): version packages'
          # Pushes made with GITHUB_TOKEN don't trigger workflows, so CI (a required
          # check) would never run on the version PR. GH_TOKEN is a personal access token.
          github-token: ${{ secrets.GH_TOKEN }}

  pack:
    if: needs.select-mode.outputs.mode == 'publish'
    needs: select-mode
    runs-on: ubuntu-latest
    outputs:
      pack-dir-artifact-id: ${{ steps.pack.outputs.pack-dir-artifact-id }}
    permissions:
      contents: read
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Install Dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # The tarball packed below is the one published, so it's checked first
      - name: Test built package
        run: npm run test:package

      - name: Pack
        id: pack
        uses: changesets/action/pack@v2
        with:
          publish-plan-artifact-id: ${{ needs.select-mode.outputs.publish-plan-artifact-id }}

  publish:
    needs: pack
    runs-on: ubuntu-latest
    permissions:
      contents: write # to push the version tag and create the GitHub release
      id-token: write # for npm trusted publishing
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Trusted publishing needs npm >= 11.5.1, which ships with Node 24 (.nvmrc)
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Install Dependencies
        run: npm ci

      - name: Show npm version
        run: npm --version

      - name: Publish to npm
        uses: changesets/action/publish@v2
        with:
          pack-dir-artifact-id: ${{ needs.pack.outputs.pack-dir-artifact-id }}
