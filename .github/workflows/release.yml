name: Release

# main is protected (PRs and the build check are required, admins included), so this
# workflow never pushes to it. With changesets on main, it opens or updates a
# "chore(release): version packages" PR. Merging that PR leaves no changesets, and
# the next run publishes to npm, pushes the version tag, and creates the GitHub release.
on:
  workflow_dispatch: # Manual trigger
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          # Full history so Changesets can generate changelogs
          fetch-depth: 0
          # Pushes made with GITHUB_TOKEN don't trigger workflows, so CI (a required
          # check) would never run on the version PR. GH_TOKEN is a personal access token.
          token: ${{ secrets.GH_TOKEN }}

      # No registry-url: changesets/action writes ~/.npmrc from NPM_TOKEN
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test built package
        run: npm run test:package

      - name: Create version PR or publish to npm
        uses: changesets/action@v1
        with:
          version: npm run version-packages
          # Publishes the dist/ built and tested above
          publish: npx changeset publish
          commit: 'chore(release): version packages'
          title: 'chore(release): version packages'
          github-token: ${{ secrets.GH_TOKEN }}
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
